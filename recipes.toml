# SuperFedora SuperForge Declarative Native Recipe Catalog (-O3 -march=native / LTO)

[[recipe]]
name = "superfedora"
binary = "superfedora"
build_system = "cargo"
repo = "https://github.com/SuperFedora/superfedora.git"
deps = ["gcc", "make"]
description = "16-Bit Rust Workstation Engine & Orchestrator TUI"

[[recipe]]
name = "supertheme"
binary = "supertheme"
build_system = "cargo"
repo = "https://github.com/SuperFedora/supertheme.git"
deps = ["gcc", "make"]
description = "16-Bit Theme, Wallpaper, Palette & WAV SFX Engine"

[[recipe]]
name = "superforge"
binary = "superforge"
build_system = "cargo"
repo = "https://github.com/SuperFedora/superforge.git"
deps = ["gcc", "make"]
description = "Hardware-Tuned Source Builder & Chromeless Firefox WebApp Engine"

[[recipe]]
name = "supershell"
binary = "superdock"
build_system = "cargo"
repo = "https://github.com/SuperFedora/supershell.git"
deps = ["gcc", "make"]
description = "16-Bit Desktop Shell Suite (superdock, superbar, supersettings, supernotify, superlock)"

[[recipe]]
name = "superagent"
binary = "superagent"
build_system = "cargo"
repo = "https://github.com/SuperFedora/superagent.git"
deps = ["gcc", "make"]
