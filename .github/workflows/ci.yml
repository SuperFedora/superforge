name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  house-laws:
    name: House Laws & Page Rules Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify AGENTS.md, LICENSE, VERSION, and README.md
        run: |
          test -f AGENTS.md
          test -f LICENSE
          test -f VERSION
          test "$(wc -l < README.md)" -lt 25

  rust-musl:
    name: Static musl Rust Binary Build & Tests
    runs-on: ubuntu-latest
    needs: house-laws
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust toolchain (x86_64-unknown-linux-musl)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Run Rust unit tests
        run: cargo test --target x86_64-unknown-linux-musl
      - name: Build release binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p dist
          for f in target/x86_64-unknown-linux-musl/release/*; do
            if [ -f "$f" ] && [ -x "$f" ]; then
              cp "$f" "dist/$(basename "$f")-x86_64-unknown-linux-musl"
            fi
          done
      - name: Publish Tier-1 Static musl Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" dist/*-x86_64-unknown-linux-musl --clobber
